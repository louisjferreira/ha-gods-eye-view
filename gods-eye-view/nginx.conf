server {
    listen 8099;
    server_name _;

    # Home Assistant Ingress connects through this address.
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Upstream God's Eye View currently sends these headers on every Vite
        # response, including the main application document. They intentionally
        # use DENY / frame-ancestors 'none' to protect Provider Settings, but
        # that also prevents Home Assistant Ingress from embedding the app.
        # Replace them at the trusted Ingress boundary with same-origin policy.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
