server {
    listen 8099;
    server_name _;

    # Home Assistant Ingress connects through this address.
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Upstream God's Eye View protects its settings page with headers that
        # also prevent Home Assistant Ingress from embedding the application.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Vite normally emits root-relative URLs. In Home Assistant Ingress the
        # application lives below a dynamic URL prefix, so rewrite the initial
        # document to keep assets inside the Ingress iframe.
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter 'href="/' 'href="./';
        sub_filter 'src="/' 'src="./';

        # The upstream frontend uses root-relative /api/* URLs. Rewrite those
        # at runtime so fetch() and WebSocket calls remain inside Ingress.
        sub_filter '<head>' '<head><script>(function(){const b=new URL(".",location.href).href;const f=window.fetch.bind(window);window.fetch=function(i,o){if(typeof i==="string"&&i.startsWith("/api/"))i=new URL(i.slice(1),b).href;return f(i,o)};const W=window.WebSocket;window.WebSocket=function(u,p){if(typeof u==="string"&&u.startsWith("/"))u=new URL(u.slice(1),b).href.replace(/^http/,"ws");return new W(u,p)};window.WebSocket.prototype=W.prototype;})();</script>';

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
