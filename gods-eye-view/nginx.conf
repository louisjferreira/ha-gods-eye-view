server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4173/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Vite's development server emits root-relative module URLs even when
        # its configured base is relative. Home Assistant Ingress itself lives
        # below a dynamic /api/hassio_ingress/... prefix, so those root URLs
        # would escape the Ingress and return HA 404 pages. Rewrite the URLs in
        # Vite's generated HTML/JS responses to remain relative to Ingress.
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="./';
        sub_filter 'src="/' 'src="./';
        sub_filter 'from "/src/' 'from "./src/';
        sub_filter 'from "/@vite/' 'from "./@vite/';
        sub_filter 'from "/node_modules/' 'from "./node_modules/';
        sub_filter 'import("/src/' 'import("./src/';
        sub_filter 'import("/@vite/' 'import("./@vite/';
        sub_filter 'import("/node_modules/' 'import("./node_modules/';
        sub_filter "from '/src/" "from './src/";
        sub_filter "from '/@vite/" "from './@vite/";
        sub_filter "from '/node_modules/" "from './node_modules/";
        sub_filter "import('/src/" "import('./src/";
        sub_filter "import('/@vite/" "import('./@vite/";
        sub_filter "import('/node_modules/" "import('./node_modules/";
        sub_filter '"/location.svg"' '"./location.svg"';
        sub_filter '"/visual-presets.svg"' '"./visual-presets.svg"';
        sub_filter '"/pin.svg"' '"./pin.svg"';
        sub_filter '"/logo.svg"' '"./logo.svg"';
        sub_filter '"/mic.svg"' '"./mic.svg"';

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
